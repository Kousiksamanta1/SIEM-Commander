[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-commander"
version = "1.0.0"
description = "A production-oriented PyQt6 operations console for Wazuh deployments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kousik Samanta" }]
dependencies = [
    "PyQt6>=6.7",
    "cryptography>=46.0.7",
    "keyring>=25.0",
    "paramiko>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
siem-commander = "siem_commander.app:run"

[tool.setuptools.packages.find]
include = ["siem_commander*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
